name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FreeTvPlayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Stable download link:
      # https://github.com/saibdp/FreeTvPlayer/releases/latest/download/FreeTvPlayer.apk
      - name: Publish APK as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FreeTvPlayer.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FreeTvPlayer.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Debug build of commit ${GITHUB_SHA::7}" \
            --latest
